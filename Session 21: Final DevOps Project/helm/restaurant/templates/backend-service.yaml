apiVersion: v1
kind: Service
metadata:
  name: {{ include "restaurant.fullname" . }}-backend
  labels:
    app: restaurant-backend
    app.kubernetes.io/name: savoria
spec:
  type: ClusterIP
  selector: {app: restaurant-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: restaurant-backend
spec:
  type: ClusterIP
  selector: {app: restaurant-backend}
  ports:
    - port: 8000
      targetPort: 8000
      name: http
