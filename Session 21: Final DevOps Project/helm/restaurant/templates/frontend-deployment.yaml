apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restaurant.fullname" . }}-frontend
  labels:
    app: restaurant-frontend
    app.kubernetes.io/name: savoria
spec:
  replicas: {{ default .Values.replicaCount .Values.frontend.replicaCount }}
  selector: {matchLabels: {app: restaurant-frontend}}
  template:
    metadata: {labels: {app: restaurant-frontend}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        imagePullPolicy: {{ default "IfNotPresent" .Values.frontend.imagePullPolicy }}
        ports: [{containerPort: 8080, name: http}]
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
