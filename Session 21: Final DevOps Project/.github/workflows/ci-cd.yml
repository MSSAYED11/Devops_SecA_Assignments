name: Savoria Restaurant Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mssayed11

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies and run pytest
        run: |
          if [ -d "Session 21: Final DevOps Project/backend" ]; then
            cd "Session 21: Final DevOps Project/backend"
          else
            cd backend
          fi
          pip install --no-cache-dir -r requirements.txt
          pytest -v

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies and build
        run: |
          if [ -d "Session 21: Final DevOps Project/frontend" ]; then
            cd "Session 21: Final DevOps Project/frontend"
          else
            cd frontend
          fi
          npm install
          npm run build

  build-scan-push:
    name: Build, Security Scan & Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          if [ -d "Session 21: Final DevOps Project" ]; then
            BACKEND_DIR="Session 21: Final DevOps Project/backend"
            FRONTEND_DIR="Session 21: Final DevOps Project/frontend"
          else
            BACKEND_DIR="backend"
            FRONTEND_DIR="frontend"
          fi
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }} -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:latest "$BACKEND_DIR"
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }} -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:latest "$FRONTEND_DIR"

      - name: Scan backend image with Trivy (Fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }}
          format: 'table'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image with Trivy (Fail on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }}
          format: 'table'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:latest

  deploy:
    name: Helm Deploy to Kubernetes
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          else
            echo "KUBE_CONFIG_DATA not set, skipping cluster config"
          fi

      - name: Deploy with Helm
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret not configured in repository. Skipping remote Helm deployment."
            exit 0
          fi
          if [ -d "Session 21: Final DevOps Project/helm/restaurant" ]; then
            CHART_DIR="Session 21: Final DevOps Project/helm/restaurant"
          else
            CHART_DIR="helm/restaurant"
          fi
          helm upgrade --install restaurant "$CHART_DIR" -n restaurant --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend \
            --set frontend.image=ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend

