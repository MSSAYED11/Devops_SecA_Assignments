name: Savoria Restaurant Management CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mssayed11

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage clean workspace (sanitize paths)
        run: |
          mkdir -p /tmp/savoria
          if [ -d "Session 21: Final DevOps Project" ]; then
            cp -r "Session 21: Final DevOps Project/." /tmp/savoria/
          else
            cp -r . /tmp/savoria/
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies and run pytest
        run: |
          cd /tmp/savoria/backend
          pip install --no-cache-dir -r requirements.txt
          pytest -v

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies and build
        run: |
          cd /tmp/savoria/frontend
          npm install
          npm run build

  build-scan-push:
    name: Build, Security Scan & Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage clean build contexts (sanitize paths)
        run: |
          mkdir -p /tmp/savoria
          if [ -d "Session 21: Final DevOps Project" ]; then
            cp -r "Session 21: Final DevOps Project/." /tmp/savoria/
          else
            cp -r . /tmp/savoria/
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }} -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:latest /tmp/savoria/backend
          docker build -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }} -t ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:latest /tmp/savoria/frontend

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan backend image with Trivy (Security Gate)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }} || true

      - name: Scan frontend image with Trivy (Security Gate)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }} || true

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:${{ github.sha }} || true
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend:latest || true
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:${{ github.sha }} || true
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend:latest || true

  deploy:
    name: Helm Deploy to Kubernetes
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          else
            echo "KUBE_CONFIG_DATA not set, skipping cluster config"
          fi

      - name: Deploy with Helm
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret not configured in repository. Skipping remote Helm deployment."
            exit 0
          fi
          mkdir -p /tmp/savoria
          if [ -d "Session 21: Final DevOps Project" ]; then
            cp -r "Session 21: Final DevOps Project/." /tmp/savoria/
          else
            cp -r . /tmp/savoria/
          fi
          helm upgrade --install restaurant /tmp/savoria/helm/restaurant -n restaurant --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-backend \
            --set frontend.image=ghcr.io/${{ env.IMAGE_OWNER }}/restaurant-frontend
