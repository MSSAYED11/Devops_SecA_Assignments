apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-demo
  labels:
    app: monitoring-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-demo
  template:
    metadata:
      labels:
        app: monitoring-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  labels:
    app: monitoring-demo
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: monitoring-demo
  type: ClusterIP
